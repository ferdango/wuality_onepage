<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img">
  <!--
    Sólo la órbita y las puntas que marcan el sentido de giro. Los cuatro nodos
    son figuras del entregable y las pone MethodCycle encima, en las diagonales
    (20,2% y 79,8% de la caja), que es donde la órbita las espera.
  -->
  <defs>
    <linearGradient id="arc-top" gradientUnits="userSpaceOnUse" x1="121.1" y1="121.1" x2="478.9" y2="121.1">
      <stop offset="0%" stop-color="#fbbd1d" />
      <stop offset="100%" stop-color="#ff1a30" />
    </linearGradient>
    <linearGradient id="arc-right" gradientUnits="userSpaceOnUse" x1="478.9" y1="121.1" x2="478.9" y2="478.9">
      <stop offset="0%" stop-color="#ff1a30" />
      <stop offset="100%" stop-color="#4fe0a0" />
    </linearGradient>
    <linearGradient id="arc-bottom" gradientUnits="userSpaceOnUse" x1="478.9" y1="478.9" x2="121.1" y2="478.9">
      <stop offset="0%" stop-color="#4fe0a0" />
      <stop offset="100%" stop-color="#2ea6ff" />
    </linearGradient>
    <linearGradient id="arc-left" gradientUnits="userSpaceOnUse" x1="121.1" y1="478.9" x2="121.1" y2="121.1">
      <stop offset="0%" stop-color="#2ea6ff" />
      <stop offset="100%" stop-color="#fbbd1d" />
    </linearGradient>

    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter id="glow-ring" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <filter id="glow-tip" x="-140%" y="-140%" width="380%" height="380%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Órbita: un trazo ancho y desenfocado que hace de resplandor y otro fino encima -->
  <g fill="none" filter="url(#glow-ring)" opacity="0.3" stroke-width="16" stroke-linecap="round">
    <path d="M121.1 121.1A253 253 0 0 1 478.9 121.1" stroke="url(#arc-top)" />
    <path d="M478.9 121.1A253 253 0 0 1 478.9 478.9" stroke="url(#arc-right)" />
    <path d="M478.9 478.9A253 253 0 0 1 121.1 478.9" stroke="url(#arc-bottom)" />
    <path d="M121.1 478.9A253 253 0 0 1 121.1 121.1" stroke="url(#arc-left)" />
  </g>
  <g fill="none" opacity="0.72" stroke-width="2.5" stroke-linecap="round">
    <path d="M121.1 121.1A253 253 0 0 1 478.9 121.1" stroke="url(#arc-top)" />
    <path d="M478.9 121.1A253 253 0 0 1 478.9 478.9" stroke="url(#arc-right)" />
    <path d="M478.9 478.9A253 253 0 0 1 121.1 478.9" stroke="url(#arc-bottom)" />
    <path d="M121.1 478.9A253 253 0 0 1 121.1 121.1" stroke="url(#arc-left)" />
  </g>

  <!-- Sentido de giro -->
  <g>
    <path d="M289 30 L315 47 L289 64 Z" fill="#fd6b27" filter="url(#glow-tip)" opacity="0.7" />
    <path d="M289 30 L315 47 L289 64 Z" fill="#fd6b27" />
    <path d="M311 570 L285 553 L311 536 Z" fill="#3fc3d0" filter="url(#glow-tip)" opacity="0.7" />
    <path d="M311 570 L285 553 L311 536 Z" fill="#3fc3d0" />
  </g>

</svg>
