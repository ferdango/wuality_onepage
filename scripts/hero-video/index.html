<!doctype html>
<!--
  Vídeo de marca del hero (public/media/video/wuality-hero.mp4): 8 s en bucle,
  1920×1080. La gran idea visual del Brand Manifesto 2026, Complejo → Simple:
  las formas de color del manual giran en espiral hacia The Wuality Point (la
  esfera roja del Brandbook), que las absorbe y late; dos anillos se abren desde
  el punto. Todo es una función periódica del tiempo, `render(t)`, así que el
  último cuadro empalma con el primero. Render y codificación: README, "Vídeo del hero".
-->
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; overflow: hidden; background: #05080a; }
  #stage { position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(1100px 900px at var(--px) var(--py), rgba(244,37,48,0.16), rgba(5,8,10,0) 70%), #05080a; }
  .fig, .point, .ring { position: absolute; left: 0; top: 0; will-change: transform; }
  .fig { width: 280px; transform-origin: 50% 50%; }
  .point { width: var(--ps); height: var(--ps); filter: drop-shadow(0 0 70px rgba(244,37,48,0.38)); }
  .ring { border-radius: 50%; border: 2px solid rgba(255,90,100,0.55);
    box-shadow: 0 0 80px 18px rgba(244,37,48,0.28), inset 0 0 80px 18px rgba(244,37,48,0.22); }
  #grain { position: absolute; inset: 0; pointer-events: none; opacity: .05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>"); }
</style></head>
<body><div id="stage"></div><div id="grain"></div>
<script>
// Bucle de T segundos: todo es periódico en t, así que el último cuadro empalma con el primero.
const T = 8;
// Encuadre por parámetros: ?w=1920&h=1080&px=0.66&py=0.44&ps=640 (apaisado, por defecto)
// o ?w=1080&h=1920&px=0.5&py=0.3&ps=560&sx=0.62&sy=1.15 (vertical, para móvil).
const q = new URLSearchParams(location.search);
const num = (k, d) => Number(q.get(k) ?? d);
const W = num('w', 1920), H = num('h', 1080), PS = num('ps', 640);
const SX = num('sx', 1.25), SY = num('sy', 0.85);   // achatamiento de la espiral
const P = { x: W * num('px', 0.66), y: H * num('py', 0.44) };   // The Wuality Point
Object.assign(document.documentElement.style, { width: W + 'px', height: H + 'px' });
Object.assign(document.body.style, { width: W + 'px', height: H + 'px' });
const st = document.documentElement.style;
st.setProperty('--px', (P.x / W * 100) + '%'); st.setProperty('--py', (P.y / H * 100) + '%'); st.setProperty('--ps', PS + 'px');
const stage = document.getElementById('stage');
const FIGS = ['cinta-calida', 'gota-azul', 'cinta-magenta', 'esfera-amarilla', 'cinta-fria', 'gota-azul', 'cinta-magenta', 'cinta-calida'];
const N = FIGS.length;
const rings = [0, 1].map(() => { const d = document.createElement('div'); d.className = 'ring'; stage.appendChild(d); return d; });
const figs = FIGS.map((name, i) => { const im = new Image(); im.src = '../../public/media/brand/figuras/' + name + '.png'; im.className = 'fig'; stage.appendChild(im); return im; });
const point = new Image(); point.src = '../../public/media/brand/pantalla/esfera-roja.png'; point.className = 'point'; stage.appendChild(point);
const frac = x => x - Math.floor(x);
const ease = p => p * p * (3 - 2 * p);
window.render = (t) => {
  // Anillos que nacen del punto y se abren hacia fuera (dos, desfasados medio ciclo).
  rings.forEach((r, k) => {
    const p = frac(t / T + k / 2);
    const d = 420 + p * 1900;
    r.style.width = r.style.height = d + 'px';
    r.style.transform = `translate(${P.x - d / 2}px, ${P.y - d / 2}px)`;
    r.style.opacity = (Math.sin(Math.PI * p) * 0.9).toFixed(3);
  });
  // Formas de color en espiral hacia el punto: entran fuera de cuadro y desaparecen al llegar.
  let pulse = 0;
  figs.forEach((im, i) => {
    const p = frac(t / T + i / N);
    const a0 = (i / N) * Math.PI * 2 + 0.6;
    const e = Math.pow(p, 1.35);
    const r = 1250 * (1 - e);
    const a = a0 + e * Math.PI * 1.15;
    const x = P.x + Math.cos(a) * r * SX, y = P.y + Math.sin(a) * r * SY;
    const s = 0.25 + 1.15 * (1 - e);
    const rot = (i % 2 ? -1 : 1) * (p * 260 + i * 40);
    const op = Math.min(1, p / 0.12) * Math.min(1, (1 - p) / 0.14);
    im.style.transform = `translate(${x - 140}px, ${y - 140}px) rotate(${rot}deg) scale(${s})`;
    im.style.opacity = op.toFixed(3);
    pulse += Math.exp(-Math.pow((p - 0.97) / 0.035, 2));
  });
  // El punto respira y late cada vez que absorbe una forma.
  const breathe = 1 + 0.025 * Math.sin((t / T) * Math.PI * 4);
  const s = breathe + 0.06 * pulse;
  point.style.transform = `translate(${P.x - PS / 2}px, ${P.y - PS / 2}px) rotate(${-24 + 6 * Math.sin((t / T) * Math.PI * 2)}deg) scale(${s})`;
};
window.ready = Promise.all([...figs, point].map(im => im.decode()));
window.ready.then(() => window.render(0));
</script></body></html>
